name: release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    defaults:
      run:
        shell: bash -euo pipefail {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
            linux: false
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            linux: true
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            linux: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Install Linux linkers
        if: matrix.linux
        run: sudo apt-get update && sudo apt-get install --yes mold musl-tools
      - name: Install Rust target
        run: rustup target add "${{ matrix.target }}"
      - name: Build release
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          RUSTFLAGS: ${{ matrix.linux && '-C target-feature=+crt-static -C link-arg=-fuse-ld=mold -C link-arg=-static -C link-arg=-Wl,--no-dynamic-linker' || '' }}
        run: cargo build --locked --profile dist --bin fd --target "${{ matrix.target }}"

      - name: Package binary
        run: cp "target/${{ matrix.target }}/dist/fd" "fd-${{ matrix.target }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fd-${{ matrix.target }}
          path: fd-${{ matrix.target }}

  release:
    name: Create pre-release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fd-*
          path: dist
          merge-multiple: true

      - name: Verify Linux ELF artifacts are fully static
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          command -v readelf >/dev/null
          X86_64_COUNT=0
          AARCH64_COUNT=0
          for binary in dist/**/*; do
            [[ -f "$binary" ]] || continue
            if ! readelf -h "$binary" >/dev/null 2>&1; then
              continue
            fi
            machine=$(readelf -h "$binary" | sed -n 's/^[[:space:]]*Machine:[[:space:]]*//p')
            case "$machine" in
              "Advanced Micro Devices X86-64") X86_64_COUNT=$((X86_64_COUNT + 1)) ;;
              AArch64) AARCH64_COUNT=$((AARCH64_COUNT + 1)) ;;
              *) printf '%s has unsupported ELF machine %s\n' "$binary" "$machine" >&2; exit 1 ;;
            esac
            program_headers=$(readelf -lW "$binary")
            if [[ "$program_headers" == *INTERP* ]]; then
              printf '%s has a dynamic ELF interpreter\n' "$binary" >&2
              exit 1
            fi
            dynamic_section=$(readelf -dW "$binary")
            if [[ "$dynamic_section" == *NEEDED* ]]; then
              printf '%s has a dynamic library dependency\n' "$binary" >&2
              exit 1
            fi
          done
          if [[ "$X86_64_COUNT" -ne 1 || "$AARCH64_COUNT" -ne 1 ]]; then
            printf 'Expected one x86_64 and one aarch64 Linux ELF artifact, found x86_64=%s aarch64=%s\n' "$X86_64_COUNT" "$AARCH64_COUNT" >&2
            exit 1
          fi

      - name: Zip artifacts
        run: for f in dist/*; do zip -9 --junk-paths "$f.zip" "$f"; done
      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: release-${{ github.sha }}
        run: gh release create "$RELEASE_TAG" dist/*.zip --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" --title "$RELEASE_TAG"
