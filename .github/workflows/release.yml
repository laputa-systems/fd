name: release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    defaults:
      run:
        shell: bash -euo pipefail {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
            linux: false
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            linux: true
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            linux: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Install Linux linkers
        if: matrix.linux
        run: sudo apt-get update && sudo apt-get install --yes mold musl-tools
      - name: Install Rust target
        run: rustup target add "${{ matrix.target }}"
      - name: Build release
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          RUSTFLAGS: ${{ matrix.linux && '-C target-feature=+crt-static -C link-arg=-fuse-ld=mold -C link-arg=-static -C link-arg=-Wl,--no-dynamic-linker' || '' }}
        run: |
          if [[ "${{ matrix.linux }}" == "true" ]]; then
            cargo build --locked --no-default-features --profile dist --bin fd --target "${{ matrix.target }}"
          else
            cargo build --locked --profile dist --bin fd --target "${{ matrix.target }}"
          fi

      - name: Package binary
        run: cp "target/${{ matrix.target }}/dist/fd" "fd-${{ matrix.target }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fd-${{ matrix.target }}
          path: fd-${{ matrix.target }}

  release:
    name: Create pre-release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fd-*
          path: dist
          merge-multiple: true

      - name: Verify Linux ELF artifacts are fully static
        run: |
          set -euo pipefail
          python3 - dist <<'PY'
          import argparse
          import os
          import struct
          import sys
          from pathlib import Path

          MACHINES = {62: "x86_64", 183: "aarch64"}
          ELFCLASS64 = 2
          ELFDATA2LSB = 1
          PT_DYNAMIC = 2
          PT_INTERP = 3
          DT_NULL = 0
          DT_NEEDED = 1
          TRACE_REQUIRED = ("/usr/lib/libc.a", "crtbegin.o")
          TRACE_FORBIDDEN = (
              ".rustup/",
              "/rustlib/",
              "/self-contained/",
              "x86_64-linux-gnu",
              "aarch64-linux-gnu",
              "libc.so",
          )


          def fail(message):
              print(f"verify-static-elf: {message}", file=sys.stderr)
              return 1


          def read_elf(path):
              data = path.read_bytes()
              if len(data) < 64 or data[:4] != b"\x7fELF":
                  return None
              if data[4] != ELFCLASS64 or data[5] != ELFDATA2LSB:
                  raise ValueError("not a little-endian ELF64 file")
              machine = struct.unpack_from("<H", data, 18)[0]
              if machine not in MACHINES:
                  raise ValueError(f"unsupported ELF machine {machine}")
              program_offset = struct.unpack_from("<Q", data, 32)[0]
              entry_size = struct.unpack_from("<H", data, 54)[0]
              entries = struct.unpack_from("<H", data, 56)[0]
              headers = []
              if entries:
                  if entry_size < 56:
                      raise ValueError("program header table is truncated")
                  for index in range(entries):
                      offset = program_offset + index * entry_size
                      if offset + 56 > len(data):
                          raise ValueError("program header table is truncated")
                      kind = struct.unpack_from("<I", data, offset)[0]
                      file_offset = struct.unpack_from("<Q", data, offset + 8)[0]
                      file_size = struct.unpack_from("<Q", data, offset + 32)[0]
                      headers.append((kind, file_offset, file_size))
              return machine, data, headers


          def dynamic_needed(data, offset, size):
              end = min(len(data), offset + size)
              while offset + 16 <= end:
                  tag, value = struct.unpack_from("<qQ", data, offset)
                  if tag == DT_NULL:
                      return False
                  if tag == DT_NEEDED:
                      return True
                  offset += 16
              return False


          def check_elf(path):
              parsed = read_elf(path)
              if parsed is None:
                  raise ValueError("not an ELF file")
              machine, data, headers = parsed
              for kind, offset, size in headers:
                  if kind == PT_INTERP:
                      raise ValueError("has a dynamic ELF interpreter")
                  if kind == PT_DYNAMIC and dynamic_needed(data, offset, size):
                      raise ValueError("has a dynamic library dependency")
              return machine


          def trace_failure(trace):
              try:
                  source = trace.read_text(encoding="utf-8", errors="replace")
              except OSError as error:
                  return f"cannot read linker trace {trace}: {error}"
              for marker in TRACE_FORBIDDEN:
                  if marker in source:
                      return f"linker trace contains a non-builder path: {marker}"
              for marker in TRACE_REQUIRED:
                  if marker not in source:
                      return f"linker trace does not name {marker}"
              return None


          def main():
              parser = argparse.ArgumentParser(prog="verify-static-elf", allow_abbrev=False)
              parser.add_argument("--trace", type=Path)
              parser.add_argument("artifacts", nargs="+", type=Path)
              args = parser.parse_args()
              explicit = []
              scanned = []
              for artifact in args.artifacts:
                  if artifact.is_symlink():
                      return fail(f"symlink is not followed: {artifact}")
                  if not artifact.exists():
                      return fail(f"artifact does not exist: {artifact}")
                  if artifact.is_dir():
                      for directory, names, filenames in os.walk(artifact, followlinks=False):
                          current = Path(directory)
                          names[:] = [name for name in names if not (current / name).is_symlink()]
                          for name in filenames:
                              path = current / name
                              if path.is_file() and not path.is_symlink():
                                  scanned.append(path)
                  else:
                      explicit.append(artifact)
              machines = set()
              verified = 0
              for path in explicit:
                  try:
                      machines.add(check_elf(path))
                      verified += 1
                  except (OSError, ValueError, struct.error) as error:
                      return fail(f"{path}: {error}")
              for path in scanned:
                  try:
                      machine = check_elf(path)
                  except ValueError:
                      continue
                  except (OSError, struct.error) as error:
                      return fail(f"{path}: {error}")
                  machines.add(machine)
                  verified += 1
              if any(artifact.is_dir() for artifact in args.artifacts):
                  missing = sorted(set(MACHINES.values()) - set(MACHINES[machine] for machine in machines))
                  if missing:
                      return fail("expected at least one artifact for " + ", ".join(missing))
              if not machines:
                  return fail("no static ELF artifacts found")
              if args.trace is not None:
                  error = trace_failure(args.trace)
                  if error is not None:
                      return fail(error)
              print(f"verified {verified} ELF artifacts")
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          PY

      - name: Zip artifacts
        run: for f in dist/*; do zip -9 --junk-paths "$f.zip" "$f"; done

      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          previous=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 \
            --json tagName --jq '.[0].tagName // ""')
          if [[ -z "$previous" ]]; then
            printf 'Initial release at %s.\n' "$GITHUB_SHA" > "$notes"
            exit 0
          fi
          compare="repos/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_SHA"
          status=$(gh api "$compare" --jq '.status')
          if [[ "$status" != ahead ]]; then
            printf 'Release notes rejected: %s is %s relative to %s, expected ahead\n' "$GITHUB_SHA" "$status" "$previous" >&2
            exit 1
          fi
          {
            printf '## Changes since %s\n\n' "$previous"
            gh api --paginate "$compare?per_page=100" --jq '.commits[] | "- \(.sha[0:12]) \(.commit.message | split("\n")[0])"'
            printf '\n**Full changelog**: %s/%s/compare/%s...%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$previous" "$GITHUB_SHA"
          } > "$notes"

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: release-${{ github.sha }}
        run: gh release create "$RELEASE_TAG" dist/*.zip --repo "$GITHUB_REPOSITORY" --prerelease --notes-file "$RUNNER_TEMP/release-notes.md" --target "$GITHUB_SHA" --title "$RELEASE_TAG"
